name: RevalAI CI/CD Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Test (Backend + Frontend)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Backend CI Setup & Validation
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f revalai/backend/requirements.txt ]; then pip install -r revalai/backend/requirements.txt; fi

    - name: Verify Backend Integrity & Database Seeding
      run: |
        cd revalai/backend
        python -c "import app.models; import app.schemas; import app.seed; print('Backend modules and models validated successfully!')"

    # 2. Frontend CI Setup & Production Build
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: revalai/frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd revalai/frontend
        npm ci

    - name: Build Frontend for Production (Vite)
      run: |
        cd revalai/frontend
        npm run build

    # 3. Deployment Notification
    - name: Deployment Status
      run: |
        echo "CI Checks Passed! Vercel Continuous Deployment (CD) pipeline triggered automatically for main branch."

